services:
  nginx-cors-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flytbase-cors-proxy
    ports:
      - "8888:8888"
    environment:
      - BACKEND_URL=${BACKEND_URL:-api-dev.flytbase.com}
    restart: unless-stopped
    networks:
      - flytbase-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  flytbase-network:
    driver: bridge
