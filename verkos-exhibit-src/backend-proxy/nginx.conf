# Nginx CORS Proxy Configuration
# Purpose: Forward requests to FlytBase backend with proper CORS headers
# Supports: Multiple environments (dev/stag/prod/eu)

user nginx;
worker_processes auto;
# Send error logs directly to stderr (visible in docker logs)
error_log stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with more details for debugging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr upstream_status: $upstream_status';

    # Send access logs directly to stdout (visible in docker logs)
    access_log /dev/stdout main;
    
    # ==========================================
    # CORS Configuration Maps
    # ==========================================
    # These maps ensure CORS headers are always set correctly
    # Uses specific origin (never wildcard) to support credentials: 'include'
    
    map $http_origin $cors_origin {
        default $http_origin;
        "" $http_origin;
    }
    
    map $request_method $cors_method {
        default "GET, POST, PUT, DELETE, PATCH, OPTIONS, HEAD";
    }
    
    map $request_method $cors_headers {
        default "Accept, Accept-Language, Content-Type, Content-Language, Authorization, X-Requested-With, X-Redirect-Uri, rid, fdi-version, st-auth-mode, anti-csrf, org-id";
    }

    # Connection tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ==========================================
    # Backend Upstream Configuration
    # ==========================================
    # This is dynamically set by environment variable BACKEND_URL
    # Default: api-dev.flytbase.com (development)
    # Override via: docker-compose.yml or docker run -e BACKEND_URL=...
    
    upstream backend {
        server ${BACKEND_URL}:443;
    }

    server {
        listen 8888;
        server_name localhost;

        # Timeout configuration (generous for dev, tune for prod)
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;

        # Large body size for file uploads
        client_max_body_size 100M;

        # Proxy logs sent to stdout/stderr (visible in docker logs)
        access_log /dev/stdout main;
        error_log stderr warn;

        # Health check endpoint
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "Nginx CORS Proxy - Backend: ${BACKEND_URL}\n";
        }

        # Main proxy location
        location / {
            # ==========================================
            # STEP 1: Handle OPTIONS (preflight) requests
            # ==========================================
            # Must return immediately before proxy_pass
            # Returns 204 No Content with all required CORS headers
            
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
                add_header 'Access-Control-Allow-Methods' '$cors_method' always;
                add_header 'Access-Control-Allow-Headers' '$cors_headers' always;
                add_header 'Access-Control-Expose-Headers' 'front-token, st-access-token, st-refresh-token, anti-csrf' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' '86400' always;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' '0';
                return 204;
            }
            
            # ==========================================
            # STEP 2: Hide upstream CORS headers
            # ==========================================
            # Prevents backend or tunnel from overriding our CORS policy
            # Essential for credentials: 'include' support
            
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header access-control-allow-origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header access-control-allow-methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header access-control-allow-headers;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header access-control-allow-credentials;
            proxy_hide_header Access-Control-Expose-Headers;
            proxy_hide_header access-control-expose-headers;
            proxy_hide_header Access-Control-Max-Age;
            proxy_hide_header access-control-max-age;
            
            # Hide CSP headers that might interfere
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Content-Security-Policy;
            proxy_hide_header X-WebKit-CSP;
            
            # ==========================================
            # STEP 3: Set request headers for backend
            # ==========================================
            
            # Host header must match backend domain
            proxy_set_header Host ${BACKEND_URL};
            
            # Preserve client information
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # Authentication headers
            proxy_set_header Authorization $http_authorization;
            
            # SuperTokens headers (header-based auth mode)
            proxy_set_header rid $http_rid;
            proxy_set_header fdi-version $http_fdi_version;
            proxy_set_header st-auth-mode $http_st_auth_mode;
            proxy_set_header anti-csrf $http_anti_csrf;
            proxy_set_header st-access-token $http_st_access_token;
            proxy_set_header st-refresh-token $http_st_refresh_token;
            
            # Application headers
            proxy_set_header org-id $http_org_id;
            
            # Origin masking: make backend think request is from localhost
            proxy_set_header Origin "http://localhost";
            
            # ==========================================
            # STEP 4: SSL configuration
            # ==========================================
            
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_verify off;
            
            # ==========================================
            # STEP 5: Performance and WebSocket support
            # ==========================================
            
            # Disable buffering for real-time responses
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
            
            # ==========================================
            # STEP 6: Forward to backend
            # ==========================================
            
            proxy_pass https://backend;
            
            # ==========================================
            # STEP 7: Add CORS headers to response
            # ==========================================
            # 'always' ensures headers are added even on error responses
            # Specific origin (not wildcard) enables credentials: 'include'
            
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Methods' '$cors_method' always;
            add_header 'Access-Control-Allow-Headers' '$cors_headers' always;
            add_header 'Access-Control-Expose-Headers' 'front-token, st-access-token, st-refresh-token, anti-csrf' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' '86400' always;
        }
    }
}
